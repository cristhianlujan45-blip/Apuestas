name: App Android (APK)

on:
  push:
    paths: ["frontend/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Los runners ubuntu-latest ya incluyen el SDK de Android (ANDROID_HOME)
      - run: npm ci --no-audit --no-fund
      - name: Exportar la app (modo estático)
        run: npm run build:mobile
      - name: Sincronizar Capacitor
        run: npx cap sync android
      - name: Compilar APK (prueba) y, si hay clave privada, APK + AAB firmados para Google Play
        working-directory: frontend/android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.${{ github.run_number }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p ../dist
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            ./gradlew assembleRelease bundleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../dist/apuestas-intel-co.apk
            cp app/build/outputs/bundle/release/app-release.aab ../dist/apuestas-intel-co.aab
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../dist/apuestas-intel-co.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: apuestas-intel-co-android
          path: frontend/dist/*
      - name: Publicar en Releases (app-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Apuestas Intel CO — APK
          prerelease: false
          body: |
            APK de Android generado automáticamente (commit ${{ github.sha }}).
            Instalación: descargue `apuestas-intel-co.apk`, ábralo en el teléfono y permita "instalar apps de origen desconocido".
            `apuestas-intel-co.aab` (si existe) es el paquete firmado para subir a Google Play.
            Versión web portable: `apuestas-intel-co-web.zip`.
          files: frontend/dist/*
