# Plataforma completa: PostgreSQL+TimescaleDB, Redis, API, worker y frontend.
# Uso: cp .env.example .env  &&  docker compose up -d --build
services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: apuestas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apuestas}
      POSTGRES_DB: apuestas
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apuestas"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    restart: unless-stopped

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://apuestas:${POSTGRES_PASSWORD:-apuestas}@db:5432/apuestas
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:3000}
    volumes: [appdata:/app/data/raw, models:/app/data/models, imports:/app/data/import]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
    ports: ["8000:8000"]
    restart: unless-stopped

  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://apuestas:${POSTGRES_PASSWORD:-apuestas}@db:5432/apuestas
      REDIS_URL: redis://redis:6379/0
    volumes: [appdata:/app/data/raw, models:/app/data/models, imports:/app/data/import]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
    restart: unless-stopped

  frontend:
    build: { context: frontend, args: { BACKEND_URL: "http://backend:8000" } }
    environment:
      BACKEND_URL: http://backend:8000
    depends_on: [backend]
    ports: ["3000:3000"]
    restart: unless-stopped

volumes:
  pgdata: {}
  redisdata: {}
  appdata: {}
  models: {}
  imports: {}
